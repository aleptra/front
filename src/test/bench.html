<!doctype html>
<html>

<body>
  <pre id="out"></pre>
  <script src="../front.js"></script>
  <script>
    var N = 200000, out = [], el = document.createElement('div')
    document.body.appendChild(el)

    function time(label, fn) {
      fn() // warm up
      var t = performance.now()
      fn()
      out.push(('  ' + label).padEnd(52) + (performance.now() - t).toFixed(1) + 'ms')
    }

    // ---- 1. the _styleMap literal, allocated per call vs hoisted ----
    var hoisted = { align: 'textAlign', alignitems: 'alignItems', alignself: 'alignSelf', bgcolor: 'backgroundColor', boxshadow: 'boxShadow', fontsize: 'fontSize', flexdirection: 'flexDirection', gridarea: 'gridArea', gridrow: 'gridRow', gridcolumn: 'gridColumn', gridcolumns: 'gridTemplateColumns', gridrows: 'gridTemplateRows', justifycontent: 'justifyContent', letterspacing: 'letterSpacing', lineheight: 'lineHeight', flexgrow: 'flexGrow', zindex: 'zIndex', minwidth: 'minWidth', minheight: 'minHeight', maxheight: 'maxHeight', maxwidth: 'maxWidth', outlinecolor: 'outlineColor', outlineoffset: 'outlineOffset', outlinestyle: 'outlineStyle', outlinewidth: 'outlineWidth', overflowx: 'overflowX', overflowy: 'overflowY', radius: 'borderRadius', textshadow: 'textShadow', valign: 'verticalAlign', wordbreak: 'wordBreak', whitespace: 'whiteSpace' }

    out.push('=== map lookup, ' + N + ' iterations ===')
    time('literal rebuilt every call (current)', function () {
      var r
      for (var i = 0; i < N; i++) {
        var m = { align: 'textAlign', alignitems: 'alignItems', alignself: 'alignSelf', bgcolor: 'backgroundColor', boxshadow: 'boxShadow', fontsize: 'fontSize', flexdirection: 'flexDirection', gridarea: 'gridArea', gridrow: 'gridRow', gridcolumn: 'gridColumn', gridcolumns: 'gridTemplateColumns', gridrows: 'gridTemplateRows', justifycontent: 'justifyContent', letterspacing: 'letterSpacing', lineheight: 'lineHeight', flexgrow: 'flexGrow', zindex: 'zIndex', minwidth: 'minWidth', minheight: 'minHeight', maxheight: 'maxHeight', maxwidth: 'maxWidth', outlinecolor: 'outlineColor', outlineoffset: 'outlineOffset', outlinestyle: 'outlineStyle', outlinewidth: 'outlineWidth', overflowx: 'overflowX', overflowy: 'overflowY', radius: 'borderRadius', textshadow: 'textShadow', valign: 'verticalAlign', wordbreak: 'wordBreak', whitespace: 'whiteSpace' }
        r = m['maxwidth'] || 'maxwidth'
      }
    })
    time('hoisted map (proposed)', function () {
      var r
      for (var i = 0; i < N; i++) r = hoisted['maxwidth'] || 'maxwidth'
    })

    out.push('', '=== unit strategy, ' + N + ' iterations ===')
    time('write, read back, retry with px (current)', function () {
      for (var i = 0; i < N; i++) {
        el.style.width = '400'
        if (!el.style.width) el.style.width = '400px'
      }
    })
    time('regex + parseFloat, single write (old)', function () {
      for (var i = 0; i < N; i++) {
        var m = '400'.match(/^(\d+)([a-z%]*)$/)
        el.style.width = m ? parseFloat(m[1]) + (m[2] || 'px') : '400'
      }
    })
    time('value already has a unit, accepted first try', function () {
      for (var i = 0; i < N; i++) {
        el.style.width = '400px'
        if (!el.style.width) el.style.width = '400pxpx'
      }
    })

    out.push('', '=== real dom.apply throughput, 50000 iterations ===')
    time('apply width=400 (needs px fallback)', function () {
      for (var i = 0; i < 50000; i++) { el.lastRunAttribute = 'width'; dom.apply(el, '400') }
    })
    time('apply zindex=5 (unitless, no fallback)', function () {
      for (var i = 0; i < 50000; i++) { el.lastRunAttribute = 'zindex'; dom.apply(el, '5') }
    })
    time('apply bgcolor=white05 (shade regex)', function () {
      for (var i = 0; i < 50000; i++) { el.lastRunAttribute = 'bgcolor'; dom.apply(el, 'white05') }
    })

    document.getElementById('out').textContent = out.join('\n')
  </script>
</body>

</html>
