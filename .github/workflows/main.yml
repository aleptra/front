name: Tests

on:
  push:
    tags:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Provide the Chrome path expected by Makefile
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome or Chromium was not found on PATH."
            exit 1
          fi
          sudo mkdir -p "/Applications/Google Chrome.app/Contents/MacOS"
          sudo ln -sf "$CHROME" "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      - name: Run tests
        run: make test
